# OpenAI Agents 兼容的技能描述文件
# 用于在不支持 SKILL.md frontmatter 的 Agent 框架中声明本技能
name: make-knowledge-cards
version: 1.0.0
description: >
  把用户粘贴的文章/文本，或本地 TXT 文件，转换成 5~8 张知识卡片。
  每张卡片包含：标题、核心知识、简明解释、例子或自测问题。
  只提取原文中真正重要的知识，一张卡片只讲一个知识点，
  删除重复内容，不编造原文没有的信息，信息不足时不强行凑数。
instructions: |
  1. 读取用户粘贴的文本或指定路径的本地 TXT 文件（UTF-8，乱码时尝试 GBK/GB18030）。
  2. 通读原文，判断文章类型（技术教程 / 概念讲解 / 观点评论 / 叙事 / 新闻）。
  3. 提炼 5~8 个真正重要的知识点：一张卡片只讲一个知识点，同一观点只保留一次。
  4. 每张卡片按固定格式输出：标题（结论式）、核心知识（一句话不超过 40 字）、
     简明解释（2~4 句）、例子或自测问题（必须基于原文）。
  5. 约束：不能编造原文没有的信息；信息不足时输出实际可提取的数量并告知用户，
     不强行凑数；只做提炼与转述。
  6. 默认在回复中直接输出全部卡片；输入为 TXT 文件时另存为 知识卡片_<原文件名>.md。
unsupported:
  - 网页抓取（URL）
  - PDF / Word / HTML 等非 TXT 格式文件
  - Anki 牌组导出（.apkg）
  - 图形界面 / 网页应用
input:
  - 用户在对话中粘贴的文章或文本
  - 本地 TXT 文件的绝对路径
output:
  format: Markdown
  cards: "5~8 张（信息不足时可少于此数）"
  per_card:
    - 标题
    - 核心知识
    - 简明解释
    - 例子或自测问题
